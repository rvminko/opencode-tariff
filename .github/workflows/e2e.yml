name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A throwaway OpenCode config: no credentials, just the model the dialog
      # pins relative prices against. The e2e mounts this dir into the container.
      - name: Prepare opencode config
        run: |
          mkdir -p "$RUNNER_TEMP/oc-config"
          printf '{"model":"ollama-cloud/glm-5.3-flash"}\n' > "$RUNNER_TEMP/oc-config/opencode.json"

      - name: "Run e2e (docker: opencode 2.2.5 + tmux)"
        env:
          TARIFF_CONFIG_DIR: ${{ runner.temp }}/oc-config
        run: node test/e2e.mjs

      - name: Cleanup container
        if: always()
        run: docker rm -f tariff-e2e || true
